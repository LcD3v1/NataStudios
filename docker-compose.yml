services:
  app:
    build: .
    container_name: nata-app
    restart: unless-stopped
    # Only exposed to localhost — Caddy/nginx terminates TLS and proxies in.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: 'file:/data/prod.db'
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      RESEND_FROM: ${RESEND_FROM:-}
    volumes:
      # Persistent SQLite database — survives rebuilds.
      - nata-data:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Automatic HTTPS (Let's Encrypt) reverse proxy.
  caddy:
    image: caddy:2-alpine
    container_name: nata-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  nata-data:
  caddy-data:
  caddy-config:
